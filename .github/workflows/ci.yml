# PR과 master push마다 실행하는 기본 검사. 자세한 내용: docs/testing/README.md
# master 브랜치 규칙에서 이 검사(check)를 머지 필수 조건으로 지정한다.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # 환경변수 없이 빌드한다. 비밀값이 없어도 빌드가 깨지지 않아야 한다.
      - name: Build
        run: npm run build
